<!DOCTYPE html>
<html lang="EN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="title_contact">联系我们 | 亚洲人本研究院</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 引入语言切换脚本 -->
  <script src="js/lang.js" defer></script>
  <script src="js/menu.js" defer></script>
</head>
<body>
  <!-- 导航栏 -->
  <header>
    <nav class="navbar container">
      <!-- 左侧：Logo + 研究院名称 -->
      <div class="nav-left">
        <a href="index.html" class="logo">
          <!-- Logo 图片 -->
          <img src="images/logo.png" alt="Logo" />
          <!-- 短一点的名称或全称都可以 -->
          <span data-key="nav_institute_name">亚洲人本研究院</span>
        </a>
      </div>
  
      <!-- 中间：导航菜单列表（桌面端显示） -->
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" data-key="nav_home">首页</a></li>
        <li><a href="about.html" data-key="nav_about">关于我们</a></li>
        <li><a href="programs.html" data-key="nav_programs">项目</a></li>
        <li><a href="contact.html" class="active" data-key="nav_contact">联系我们</a></li>
      </ul>
  
      <!-- 右侧：语言切换按钮 + 汉堡按钮（移动端） -->
      <div class="nav-right">
        <!-- 语言切换 -->
        <button id="lang-toggle-btn" class="btn-lang">中文</button>
        <!-- 汉堡按钮（仅移动端可见） -->
        <button class="hamburger" id="hamburger-btn">&#9776;</button>
      </div>
    </nav>
  </header>
  <!-- 页面标题区域 -->
  <section class="page-header">
    <div class="container">
      <h1 data-key="about_title">联系我们</h1>
    </div>
  </section>
  <!-- 联系内容区域 -->
  <section class="contact-content">
    <div class="container">
      <p data-key="contact_intro">
        若您对我们的项目感兴趣，或希望与我们建立合作关系，请随时与我们联系！
      </p>
      <div class="contact-info">
        <p><strong data-key="contact_phone_label">电话：</strong>+86 1234-5678</p>
        <p><strong data-key="contact_email_label">邮箱：</strong>info@personcenteredasia.org</p>
        <p><strong data-key="contact_address_label">地址：</strong>北京市朝阳区某某路 123 号</p>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer>
    <div class="container footer-container">
      <p data-key="footer_copyright">
        © 2025 亚洲人本研究院 (The Person Centered Institute of Asia). All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
