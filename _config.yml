title: "亚洲人本研究院 | PCIA"
baseurl: ""
url: "https://pcia.asia"
markdown: kramdown

permalink: /:lang/:title/

future: true

timezone: Asia/Shanghai

collections_dir: .

# ✅ 声明新的 collection，正确指向 _blog_en/ 和 _blog_zh/
collections:
  blog_zh:
    output: true
    permalink: /blog_zh/:title/
  blog_en:
    output: true
    permalink: /blog_en/:title/

  programs_zh:
    output: true
    permalink: /zh/programs/:title/
  programs_en:
    output: true
    permalink: /en/programs/:title/

# ✅ 修正 defaults，确保 _blog_en/ 和 _blog_zh/ 里的文章能被识别
defaults:
  # （A）静态页面：/zh 目录
  - scope:
      path: "zh"
      type: "pages"
    values:
      lang: zh

  # （B）静态页面：/en 目录
  - scope:
      path: "en"
      type: "pages"
    values:
      lang: en

  # ✅ 修正博客文章：_blog_zh 目录
  - scope:
      path: "_blog_zh"
      type: "blog_zh"
    values:
      lang: zh

  # ✅ 修正博客文章：_blog_en 目录
  - scope:
      path: "_blog_en"
      type: "blog_en"
    values:
      lang: en

  # （E）项目（中文）：_programs/zh
  - scope:
      path: "_programs_zh"
      type: "programs_zh"
    values:
      lang: zh

  # （F）项目（英文）：_programs/en
  - scope:
      path: "_programs_en"
      type: "programs_en"
    values:
      lang: en
