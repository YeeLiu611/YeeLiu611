title: "亚洲人本研究院 | PCIA"
baseurl: ""
url: "https://pcia.asia"
markdown: kramdown

permalink: /:categories/:title/

# -- 1) 对 /zh 和 /en 文件夹下的页面做默认设置 --
defaults:
  # （A）静态页面：/zh 目录
  - scope:
      path: "zh"
      type: "pages"  # 只针对页面
    values:
      lang: zh
      categories: zh

  # （B）静态页面：/en 目录
  - scope:
      path: "en"
      type: "pages"
    values:
      lang: en
      categories: en

  # （C）博客文章：_posts/zh
  - scope:
      path: "_posts/zh"
      type: "posts"  # 只针对文章
    values:
      lang: zh
      categories: zh

  # （D）博客文章：_posts/en
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      lang: en
      categories: en
