backend:
  name: git-gateway
  repo: yeeliu611/YeeLiu611       # 请替换成你的 GitHub 仓库地址
  branch: main
  proxy: false
  auth:
    client_id: Ov23lil8yXEgwjwxg75d

media_folder: "images/uploads"
public_folder: "/images/uploads"

# ----------------------------------------------
# Netlify CMS 的内容管理配置
# ----------------------------------------------
collections:

  # ================================
  # 1) 中文页面
  # ================================
  - name: "pages_zh"
    label: "中文页面"
    folder: "zh"          # 存放中文页面的目录
    create: true          # 允许在 CMS 里新建页面
    slug: "{{slug}}"
    fields:
      - { name: "lang", label: "语言", widget: "hidden", default: "zh" }
      - { name: "title", label: "页面标题", widget: "string" }
      - { name: "alternate_url", label: "对应英文页面链接", widget: "string", default: "/en/", required: false }
      - { name: "hero_title", label: "首页大标题", widget: "string", required: false }
      - { name: "hero_subtitle", label: "副标题", widget: "string", required: false }
      - { name: "hero_btn", label: "按钮文字", widget: "string", required: false }
      - { name: "intro_title", label: "介绍标题", widget: "string", required: false }
      - { name: "intro_text", label: "介绍文本", widget: "text", required: false }
      - { name: "body", label: "正文内容", widget: "markdown" }

  # ================================
  # 2) 英文页面
  # ================================
  - name: "pages_en"
    label: "英文页面"
    folder: "en"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "lang", label: "语言", widget: "hidden", default: "en" }
      - { name: "title", label: "页面标题", widget: "string" }
      - { name: "alternate_url", label: "对应中文页面链接", widget: "string", default: "/zh/", required: false }
      - { name: "hero_title", label: "首页大标题", widget: "string", required: false }
      - { name: "hero_subtitle", label: "副标题", widget: "string", required: false }
      - { name: "hero_btn", label: "按钮文字", widget: "string", required: false }
      - { name: "intro_title", label: "介绍标题", widget: "string", required: false }
      - { name: "intro_text", label: "介绍文本", widget: "text", required: false }
      - { name: "body", label: "正文内容", widget: "markdown" }

  # ================================
  # 3) 博客文章（中文）
  # ================================
  - name: "blog_zh"
    label: "博客文章（中文）"
    folder: "_posts/zh"   # 存放中文博客的文件夹
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "layout", widget: "hidden", default: "post" }
      - { name: "lang", widget: "hidden", default: "zh" }
      - { name: "date", label: "发布日期", widget: "datetime" }
      # 统一标题字段，用于生成 URL
      - { name: "title", label: "标题", widget: "string" }
      - { name: "title_zh", label: "标题（中文）", widget: "string" }
      - { name: "body_zh", label: "正文（中文）", widget: "markdown" }
      - { name: "alternate_url", label: "对应英文链接", widget: "string", default: "/en/blog/", required: false }

  # ================================
  # 4) 博客文章（英文）
  # ================================
  - name: "blog_en"
    label: "博客文章（英文）"
    folder: "_posts/en"   # 存放英文博客的文件夹
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: "layout", widget: "hidden", default: "post" }
      - { name: "lang", widget: "hidden", default: "en" }
      - { name: "date", label: "发布日期", widget: "datetime" }
      # 统一标题字段，用于生成 URL
      - { name: "title", label: "标题", widget: "string" }
      - { name: "title_en", label: "标题（英文）", widget: "string" }
      - { name: "body_en", label: "正文（英文）", widget: "markdown" }
      - { name: "alternate_url", label: "对应中文链接", widget: "string", default: "/zh/blog/", required: false }