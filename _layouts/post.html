---
layout: default
---

<article class="post-container">
  <header class="post-header">
    <h1 
      class="post-title"
      data-zh="{{ page.title_zh }}"
      data-en="{{ page.title_en }}"
    >
      {{ page.title_zh }}
    </h1>
    <p class="post-meta">
      <span class="post-date">
        {{ page.date | date: "%Y-%m-%d-%H" }}
      </span>
    </p>
  </header>

  <div 
    class="post-body"
    data-zh="{{ page.body_zh | markdownify | escape }}"
    data-en="{{ page.body_en | markdownify | escape }}"
  >
    {{ page.body_zh | markdownify }}
  </div>
</article>

<!-- 上一篇 / 下一篇导航 -->
<nav class="post-nav">
  {% if page.previous %}
    <a class="post-nav-link prev" href="{{ page.previous.url }}">上一篇: {{ page.previous.title_zh }}</a>
  {% endif %}
  {% if page.next %}
    <a class="post-nav-link next" href="{{ page.next.url }}">下一篇: {{ page.next.title_zh }}</a>
  {% endif %}
</nav>
