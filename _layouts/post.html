---
layout: default
---

<article class="post-container container content-container">
  <div class="post-header">
    <h1 class="post-title">
      {% if page.lang == "zh" %}
        {{ page.title_zh }}
      {% else %}
        {{ page.title_en }}
      {% endif %}
    </h1>
  </div>
  <div class="post-body">
    {{ content | markdownify }}
  </div>
</article>

<div class="post-container">
  <hr>
</div>

{% if page.collection == "blog_zh" or page.collection == "blog_en" %}
  {% include post_nav.html %}
{% endif %}
