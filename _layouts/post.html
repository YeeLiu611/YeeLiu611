---
layout: default
---

<article class="post-container">
  <div class="post-header">
    <h1 class="post-title">
      {% if page.lang == "zh" %}
        {{ page.title_zh }}
      {% else %}
        {{ page.title_en }}
      {% endif %}
    </h1>
    <p class="post-meta">
      <span class="post-date">
        {{ page.date | date: "%Y-%m-%d" }}
      </span>
    </p>
  </div>
  <div class="post-body">
    {{ content | markdownify }}
  </div>
</article>

<div class="post-container">
  <hr>
</div>

{% if page.collection == "blog_zh" or page.collection == "blog_en" %}
  {% include post_nav.html %}
{% endif %}
