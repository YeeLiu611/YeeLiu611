---
layout: post_nav
---

<article class="post-container">
  <div class="post-header">
    <h1 class="post-title">
      {% if page.lang == "zh" %}
        {{ page.title_zh }}
      {% else %}
        {{ page.title_en }}
      {% endif %}
    </h1>
    <p class="post-meta">
      <span class="post-date">
        {{ page.date | date: "%Y-%m-%d-%H" }}
      </span>
    </p>
  </div>
  <div class="post-body">
    {{ content | markdownify }}
  </div>
</article>
