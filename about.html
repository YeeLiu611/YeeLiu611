<!DOCTYPE html>
<html lang="EN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="title_about">关于我们 | 亚洲人本学院</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 引入语言切换脚本 -->
  <script src="js/lang.js" defer></script>
  <script src="js/menu.js" defer></script>
</head>
<body>
  <!-- 导航栏 -->
  <header>
    <nav class="navbar container">
      <!-- 左侧：Logo + 学院名称 -->
      <div class="nav-left">
        <a href="index.html" class="logo">
          <!-- Logo 图片 -->
          <img src="images/logo.png" alt="Logo" />
          <!-- 短一点的名称或全称都可以 -->
          <span data-key="nav_institute_name">亚洲人本学院</span>
        </a>
      </div>
  
      <!-- 中间：导航菜单列表（桌面端显示） -->
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" data-key="nav_home">首页</a></li>
        <li><a href="about.html" class="active" data-key="nav_about">关于我们</a></li>
        <li><a href="programs.html" data-key="nav_programs">项目</a></li>
        <li><a href="contact.html" data-key="nav_contact">联系我们</a></li>
      </ul>
  
      <!-- 右侧：语言切换按钮 + 汉堡按钮（移动端） -->
      <div class="nav-right">
        <!-- 语言切换 -->
        <button id="lang-toggle-btn" class="btn-lang">简体中文</button>
        <!-- 汉堡按钮（仅移动端可见） -->
        <button class="hamburger" id="hamburger-btn">&#9776;</button>
      </div>
    </nav>
  </header>

  <!-- 页面标题区域 -->
  <section class="page-header">
    <div class="container">
      <h1 data-key="about_title">关于我们</h1>
    </div>
  </section>

  <!-- 内容区域 -->
  <section class="about-content">
    <div class="container">
      <h2 data-key="about_section_title">学院简介</h2>
      <p data-key="about_text">
        亚洲人本学院成立于20XX年，致力于将人本主义教育理念在亚洲地区推广。我们秉持着尊重、关怀、理解的原则，旨在帮助每一个人发掘潜力，实现自我成长。
      </p>
    </div>
  </section>

  <!-- 页脚 -->
  <footer>
    <div class="container footer-container">
      <p data-key="footer_copyright">
        © 2025 亚洲人本学院 (The Person Centered Institute of Asia). All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
