<!DOCTYPE html>
<html lang="EN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-key="title_programs">项目 | 亚洲人本学院</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 引入语言切换脚本 -->
  <script src="js/lang.js" defer></script>
  <script src="js/menu.js" defer></script>
</head>
<body>
  <!-- 导航栏 -->
  <header>
    <nav class="navbar container">
      <!-- 左侧：Logo + 学院名称 -->
      <div class="nav-left">
        <a href="index.html" class="logo">
          <!-- Logo 图片 -->
          <img src="images/logo.png" alt="Logo" />
          <!-- 短一点的名称或全称都可以 -->
          <span data-key="nav_institute_name">亚洲人本研究院</span>
        </a>
      </div>
  
      <!-- 中间：导航菜单列表（桌面端显示） -->
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" data-key="nav_home">首页</a></li>
        <li><a href="about.html" data-key="nav_about">关于我们</a></li>
        <li><a href="programs.html" class="active" data-key="nav_programs">项目</a></li>
        <li><a href="contact.html" data-key="nav_contact">联系我们</a></li>
      </ul>
  
      <!-- 右侧：语言切换按钮 + 汉堡按钮（移动端） -->
      <div class="nav-right">
        <!-- 语言切换 -->
        <button id="lang-toggle-btn" class="btn-lang">中文</button>
        <!-- 汉堡按钮（仅移动端可见） -->
        <button class="hamburger" id="hamburger-btn">&#9776;</button>
      </div>
    </nav>
  </header>

  <!-- 页面标题区域 -->
  <section class="page-header">
    <div class="container">
      <h1 data-key="programs_title">我们的项目</h1>
    </div>
  </section>

  <!-- 项目内容区域 -->
  <section class="programs-content">
    <div class="container">
      <h2 data-key="program1_title">人本教育工作坊</h2>
      <p data-key="program1_desc">
        深入探讨人本主义理念，结合实际案例，提升个人成长和团队协作能力。
      </p>
      <h2 data-key="program2_title">心理咨询师培训</h2>
      <p data-key="program2_desc">
        专为心理咨询师和辅导人员设计，融合理论与实践的高质量培训课程。
      </p>
      <h2 data-key="program3_title">组织与团队发展课程</h2>
      <p data-key="program3_desc">
        以人本管理为核心，提升组织效能和团队凝聚力。
      </p>
      <h2 data-key="program4_title">国际研讨会</h2>
      <p data-key="program4_desc">
        定期邀请国际专家，共同探讨人本教育与发展的前沿话题。
      </p>
    </div>
  </section>

  <!-- 页脚 -->
  <footer>
    <div class="container footer-container">
      <p data-key="footer_copyright">
        © 2025 亚洲人本学院 (The Person Centered Institute of Asia). All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
