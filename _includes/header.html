<header>
  <nav class="navbar container">
    <div class="nav-left">
      <a href="{{ '/' | append: page.lang | append: '/' | relative_url }}" class="logo">
        <img src="{{ '/images/logo.png' | relative_url }}" alt="Logo" />
        <span data-key="nav_institute_name">亚洲人本研究院</span>
      </a>
    </div>
    <ul class="nav-links" id="nav-links">
      <!-- 首页链接 -->
      <li><a href="{{ '/' | append: page.lang | append: '/' | relative_url }}" data-key="nav_home">首页</a></li>
      <!-- 关于我们 -->
      <li><a href="{{ '/' | append: page.lang | append: '/about/' | relative_url }}" data-key="nav_about">关于我们</a></li>
      <!-- 项目 -->
      <li><a href="{{ '/' | append: page.lang | append: '/programs/' | relative_url }}" data-key="nav_programs">项目</a></li>
      <!-- 联系我们 -->
      <li><a href="{{ '/' | append: page.lang | append: '/contact/' | relative_url }}" data-key="nav_contact">联系我们</a></li>
      <!-- 博客 -->
      <li><a href="{{ '/' | append: page.lang | append: '/blog/' | relative_url }}" data-key="nav_blog">博客</a></li>
    </ul>
    <div class="nav-right">
      {% if page.lang == "zh" %}
        <a href="{{ page.alternate_url }}" id="lang-toggle-btn" class="btn-lang">EN</a>
      {% else %}
        <a href="{{ page.alternate_url }}" id="lang-toggle-btn" class="btn-lang">中文</a>
      {% endif %}
      <button class="hamburger" id="hamburger-btn">&#9776;</button>
    </div>
  </nav>
</header>
